[project]
name = "repairbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reich Márton", email = "marton.reich@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "google-genai>=2.31.0",
    "httpx2>=2.13.1",
    "jwt>=1.4.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uuid>=1.30",
    "uvicorn>=0.54.0",
]

[project.scripts]
repairbot = "repairbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
